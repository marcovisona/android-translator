[project]
name = "android-translator"
version = "2.0.0"
description = "A unified CLI tool for managing translations in Android projects (strings.xml and HTML files)"
authors = [
    { name = "Marco Visonà" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4.0"
keywords = ["android", "translation", "i18n", "l10n", "strings", "excel"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
]
dependencies = [
    "pandas>=2.0.0,<3.0.0",
    "openpyxl>=3.0.0,<4.0.0",
]

[project.urls]
homepage = "https://github.com/marcovisona/android-translator"
repository = "https://github.com/marcovisona/android-translator"

[project.scripts]
android-translator = "android_translator:main"

[project.gui-scripts]
android-translator-gui = "android_translator_gui:main"

[tool.poetry]
packages = [
    { include = "commands" },
    { include = "android_translator.py" },
    { include = "android_translator_gui.py" },
]

[dependency-groups]
dev = ["pytest>=7.0.0,<8.0.0"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
